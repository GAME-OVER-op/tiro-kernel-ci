name: Build tiro KERNEL (NX769J) - standalone Kleaf

# Standalone QCOM Kleaf/Bazel kernel build for Nubia/RedMagic tiro (NX769J, SM8650 / pineapple).
# Base GKI = pristine AOSP kernel/common android14-6.1 (the SAME GKI branch the device's stock /
# LineageOS 23.2 ROM tracks, ASB-2026-06-01), NOT the OnePlus common fork. The OnePlus
# kernel_manifest is used ONLY to bootstrap the QCOM Kleaf infra (build/ + prebuilts/ + external/);
# `common` is then replaced with the AOSP GKI and overlaid with the nubia msm-kernel + device-trees.
# Rationale: a standard android14-6.1 GKI Image is KMI-compatible with the device's stock vendor
# modules (the GKI promise), so NO ABI-breaking symbol drops / module trims / custom LOCALVERSION are
# needed -- those were OnePlus-base-only hacks and are what broke /data. Produces boot.img +
# vendor_boot.img. TEST WITH `fastboot boot boot.img` (RAM), NEVER `fastboot flash boot`.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # kernel "author" -> shows as (kurumi@dev) in /proc/version
      KBUILD_BUILD_USER: kurumi
      KBUILD_BUILD_HOST: dev
      # --- QCOM Kleaf infra bootstrap ONLY (build/ + prebuilts/ + external/; its `common`
      #     fork is discarded and replaced with pristine AOSP GKI below) ---
      MANIFEST_URL: https://github.com/OnePlusOSS/kernel_manifest.git
      MANIFEST_BRANCH: oneplus/sm8650
      MANIFEST_FILE: oneplus_12_b.xml
      # --- pristine AOSP GKI common (matches the device's stock/LineageOS android14-6.1 LTS) ---
      GKI_COMMON_REPO: https://android.googlesource.com/kernel/common
      GKI_COMMON_BRANCH: android14-6.1
      # --- root variants ---
      # KSU-only tracks the fast-moving next branch. KSU+SuSFS no longer pins an
      # old v3.1.x ref: it scans KernelSU-Next refs, picks the newest ref that
      # already exposes CONFIG_KSU_SUSFS, and rejects refs older than the current
      # manager minimum. This keeps the in-kernel driver version aligned with the
      # auto-updating KernelSU-Next Manager whenever upstream provides a matching
      # legacy-susfs ref.
      KSU_NEXT_REF: next
      KSU_SUSFS_REF: auto
      KSU_SUSFS_MIN_VERSION: "33188"
      KSU_SUSFS_ALLOW_OLD: "false"
      SUSFS_BRANCH: gki-android14-6.1
      # --- nubia overlay sources ---
      NUBIA_KERNEL_REPO: https://github.com/nubia-sm8650-devs/android_kernel_nubia_sm8650.git
      NUBIA_DTS_REPO: https://github.com/nubia-sm8650-devs/android_kernel_nubia_sm8650-devicetrees.git
      NUBIA_BRANCH: lineage-23.2
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Maximize build disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          # 16 GB swap: the vmlinux LTO link + parallel image/module actions peak
          # well above the 16 GB runner RAM; without headroom the runner is OOM-killed
          # ("hosted runner lost communication"). Swap lives on the freed build volume.
          swap-size-mb: 16384
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: /mnt/src

      - name: Give runner user ownership of the build mount
        run: sudo chown -R "$USER":"$USER" /mnt/src

      - name: Show free space + swap (before sync)
        run: |
          df -h /mnt/src /
          echo '--- memory / swap ---'
          free -h
          swapon --show || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex git git-lfs gnupg gperf \
            libelf-dev liblz4-tool libssl-dev libxml2-utils lzop rsync zip \
            zlib1g-dev python3 python-is-python3

      - name: Build Kurumi Rust daemon (static aarch64, replaces the shell kurumi_battery)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          # The daemon is a USERSPACE binary shipped in the AnyKernel overlay.d ramdisk and
          # launched by Magisk on boot_completed. It touches NO kernel source and does not affect
          # the kernel build -- it only writes /sys + /proc at runtime (fully reversible).
          # Android uses bionic (not glibc), so we build a FULLY STATIC musl binary that runs
          # with no libc dependency. Pure-std crate -> the glibc aarch64 gcc is fine as the
          # linker driver; Rust's self-contained musl provides crt + libc for the static link.
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-musl
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc
          cd kurumi-daemon
          # Build all THREE profiles from the single source. CPU, I/O and Wi-Fi
          # sleep/push policy are selected by cargo feature (eco|balance|full).
          # The flasher installs whichever one the user picks at flash time.
          BINDIR="$GITHUB_WORKSPACE/anykernel/files/kurumi_bin"
          mkdir -p "$BINDIR"
          for p in eco balance full; do
            echo "=== building kurumi profile: $p ==="
            cargo build --release --target aarch64-unknown-linux-musl --no-default-features --features "$p"
            BIN=target/aarch64-unknown-linux-musl/release/kurumi
            [ -f "$BIN" ] || { echo "ERROR: kurumi ($p) binary not produced"; exit 1; }
            aarch64-linux-gnu-strip "$BIN" || true
            file "$BIN"
            file "$BIN" | grep -q 'ARM aarch64'      || { echo "ERROR: $p daemon is not an aarch64 binary"; exit 1; }
            file "$BIN" | grep -q 'statically linked' || { echo "ERROR: $p daemon is not statically linked"; exit 1; }
            install -D -m0755 "$BIN" "$BINDIR/kurumi_$p"
            rm -f "$BIN"   # force a clean relink for the next feature set
          done
          echo '--- built profile binaries ---'; ls -la "$BINDIR"

      - name: Install the 'repo' tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config --global user.name  "tiro-ci"
          git config --global user.email "tiro-ci@users.noreply.github.com"
          git config --global color.ui false
          git config --global advice.detachedHead false

      - name: Configure ccache
        run: |
          echo "USE_CCACHE=1"                 >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=/usr/bin/ccache"  >> "$GITHUB_ENV"
          echo "CCACHE_DIR=/mnt/src/.ccache"  >> "$GITHUB_ENV"
          /usr/bin/ccache -M 15G || true

      - name: repo init - OnePlus SM8650 kernel_manifest
        working-directory: /mnt/src
        run: |
          mkdir -p kp && cd kp
          repo init --depth=1 --no-clone-bundle \
            -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" -m "$MANIFEST_FILE"

      - name: repo sync
        working-directory: /mnt/src/kp
        run: |
          # CodeLinaro (git.codelinaro.org = the 'clo-la' remote hosting the QCOM
          # prebuilts: clang / gcc / bazel / build-tools / jdk / stardoc) intermittently
          # returns "remote: The git server, Gitaly, is not available at this time" and
          # aborts the whole sync. Retry the sync a few times and let repo retry
          # individual fetches so a transient server-side blip does not fail the job.
          n=0; max=6
          until repo sync -c -j"$(nproc --all)" --retry-fetches=3 \
            --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune; do
            n=$((n+1))
            if [ "$n" -ge "$max" ]; then
              echo "ERROR: repo sync still failing after $max attempts - likely a CodeLinaro/Gitaly outage; re-run the workflow later."
              exit 1
            fi
            echo "repo sync attempt $n/$max failed (transient CodeLinaro/Gitaly outage?) - retrying in 60s..."
            sleep 60
          done
          echo 'space after sync:'; df -h /mnt/src
          echo 'top-level layout:'; ls -la

      - name: Overlay nubia msm-kernel + device-trees
        working-directory: /mnt/src/kp/kernel_platform
        run: |
          set -e
          echo '--- replacing the OnePlus common fork with pristine AOSP GKI (android14-6.1) ---'
          echo '--- this is the SAME GKI branch the device stock/LineageOS ROM tracks, so the ---'
          echo '--- resulting GKI Image is KMI-compatible with the on-device stock vendor modules ---'
          rm -rf common
          git clone --depth=1 -b "$GKI_COMMON_BRANCH" "$GKI_COMMON_REPO" common
          echo '--- replacing base msm-kernel with nubia fork ---'
          rm -rf msm-kernel
          git clone --depth=1 -b "$NUBIA_BRANCH" "$NUBIA_KERNEL_REPO" msm-kernel
          echo '--- placing nubia device-trees at the symlink target (sibling) ---'
          rm -rf sm8650-devicetrees
          git clone --depth=1 -b "$NUBIA_BRANCH" "$NUBIA_DTS_REPO" sm8650-devicetrees
          echo '--- FIX: device-trees kernel_dtstree glob omits subdir Kbuild (audio/tiro/...) ---'
          echo '--- add qcom/**/Kbuild so make dtbs can descend into subdirs inside the Bazel sandbox ---'
          sed -i 's#"qcom/Makefile",#"qcom/Makefile",\n            "qcom/**/Kbuild",\n            "qcom/**/Makefile",#' sm8650-devicetrees/BUILD.bazel
          grep -n Kbuild sm8650-devicetrees/BUILD.bazel || { echo 'ERROR: dtstree glob patch failed'; exit 1; }
          echo '--- FIX: generic techpack DTBOs (audio/camera/...) need sm8650-modules headers absent from the Kleaf sandbox ---'
          echo '--- trim device-trees to the tiro set: base pineapple dtb + mtp + tiro overlay (what dist consumes) ---'
          python3 "$GITHUB_WORKSPACE/scripts/tiro_dtb_trim.py" sm8650-devicetrees
          grep -nE '^subdir-y' sm8650-devicetrees/qcom/Makefile
          grep -n 'zte-tiro-overlay.dtbo' sm8650-devicetrees/qcom/platform_map.bzl || { echo 'ERROR: platform_map trim failed'; exit 1; }
          echo '--- (KMI symbol drop REMOVED: the AOSP GKI common exports the standard android14-6.1 ---'
          echo '---  KMI that the nubia msm-kernel QCOM symbol list is built against -> ABI parity) ---'
          echo '--- FIX: nubia config builds drivers/leds/aw22xxx/zte_led.ko but pineapple.bzl module_outs omits it ---'
          echo '--- declare it so Kleaf does not abort with "kernel modules are built but not copied" ---'
          python3 "$GITHUB_WORKSPACE/scripts/tiro_module_outs_fix.py" msm-kernel
          grep -q 'drivers/leds/aw22xxx/zte_led.ko' msm-kernel/pineapple.bzl || { echo 'ERROR: module_outs fix failed'; exit 1; }
          echo '--- NOTE: the nubia OEM defconfig fragments (oem/pineapple_diff.config + ---'
          echo '--- oem/boards/tiro_diff.config) are DELIBERATELY NOT applied here. They target the ---'
          echo '--- full vendor pineapple build (perf/consolidate) where vendor drivers are =y; the ---'
          echo '--- bare gki target forces them to =m and check_merged_defconfig then aborts ---'
          echo '--- (NFC_ST54J y->m). Those peripheral drivers already ship as stock vendor_dlkm .ko. ---'
          echo '--- (GKI module trim REMOVED: with the AOSP GKI base, cdc-acm/usbserial/rfcomm find ---'
          echo '---  __tty_port_tty_hangup normally, so the stock module manifests build unchanged) ---'
          echo '--- verifying the device-tree symlink resolves ---'
          ls -la msm-kernel/arch/arm64/boot/dts/vendor
          test -e msm-kernel/arch/arm64/boot/dts/vendor

      - name: Sanity-check kleaf compatibility (super_image)
        working-directory: /mnt/src/kp/kernel_platform
        run: |
          KB=build/kernel/kleaf/kernel.bzl
          if grep -q 'super_image' "$KB"; then
            echo "OK: base kleaf exports super_image - compatible with nubia msm-kernel."
          else
            echo "ERROR: base kleaf lacks super_image (wrong manifest base)."; exit 1
          fi

      - name: Apply tiro kernel customizations (power-saving + kernel name)
        working-directory: /mnt/src/kp/kernel_platform
        run: |
          set -e
          DEF=msm-kernel/arch/arm64/configs/gki_defconfig
          FRAG=msm-kernel/arch/arm64/configs/vendor/pineapple_GKI.config
          [ -f "$DEF" ]  || { echo "missing $DEF";  exit 1; }
          [ -f "$FRAG" ] || { echo "missing $FRAG"; exit 1; }

          # ===================================================================
          # BOOT-CRITICAL FIX: the flashed boot.img Image (uname
          # 6.1.x-android14-11) is built from common/ (pristine AOSP GKI), NOT
          # from msm-kernel/. So MODULE_SIG_PROTECT must be disabled in COMMONs
          # gki_defconfig, else the kernel rejects the stock /system_dlkm GKI
          # modules ("<mod>: exports protected symbol ... Permission denied":
          # rfkill/bt/net). That cascades rfkill->btpower->bt_fm_slim and leaves
          # the ASoC card soc:spf_core_platform:sound stuck in -EPROBE_DEFER ->
          # no ALSA card -> audioserver crash loop -> boot animation hangs.
          # ===================================================================
          CDEF=common/arch/arm64/configs/gki_defconfig
          [ -f "$CDEF" ] || { echo "missing $CDEF"; exit 1; }
          # DELETE the line (do NOT write "# ... is not set"): GKI check_defconfig runs
          # `make savedefconfig` and requires an EXACT match. savedefconfig omits
          # default-n symbols, so an explicit "# CONFIG_MODULE_SIG_PROTECT is not set"
          # fails the gate ("savedefconfig does not match"). MODULE_SIG_PROTECT defaults
          # to n, so removing the =y line disables it and still matches savedefconfig.
          # Release/daily cleanup for the actual GKI Image config. For COMMON's
          # gki_defconfig, prefer deleting default-n debug/UBSAN =y lines instead
          # of writing explicit '# ... is not set' entries: common runs an exact
          # savedefconfig gate, and savedefconfig omits default-n symbols.
          #
          # IMPORTANT: do NOT disable KASAN here. The android14-6.1 QCOM GKI
          # strict KMI symbol list expects kasan_flag_enabled in ksymtab. Removing
          # CONFIG_KASAN makes the build fail with:
          #   Symbols missing from the ksymtab: kasan_flag_enabled
          # So KASAN is kept for KMI compatibility; UBSAN/PM/thermal debug cleanup
          # stays release-safe.
          sed -i \
            -e '/^CONFIG_MODULE_SIG_PROTECT=y/d' \
            -e '/^CONFIG_PM_DEBUG=y/d' \
            -e '/^CONFIG_PM_ADVANCED_DEBUG=y/d' \
            -e '/^CONFIG_THERMAL_STATISTICS=y/d' \
            -e '/^CONFIG_THERMAL_EMULATION=y/d' \
            -e '/^CONFIG_UBSAN=y/d' \
            -e '/^CONFIG_UBSAN_/d' \
            -e '/^# CONFIG_UBSAN_.* is not set$/d' \
            "$CDEF"
          echo "--- common gki_defconfig release cleanup now: ---"
          grep -nE 'MODULE_SIG_PROTECT|PM_DEBUG|PM_ADVANCED_DEBUG|THERMAL_STATISTICS|THERMAL_EMULATION|KASAN|UBSAN' "$CDEF" || echo '(release cleanup symbols absent from common gki_defconfig)'
          if grep -qE '^(CONFIG_MODULE_SIG_PROTECT|CONFIG_UBSAN|CONFIG_PM_DEBUG|CONFIG_THERMAL_STATISTICS|CONFIG_THERMAL_EMULATION)=y' "$CDEF"; then
            echo 'ERROR: failed to remove active UBSAN/debug/module-protect symbols from common gki_defconfig'; exit 1
          fi
          if ! grep -q '^CONFIG_KASAN=y' "$CDEF"; then
            echo 'ERROR: CONFIG_KASAN must stay enabled to satisfy QCOM GKI KMI symbol list (kasan_flag_enabled)'; exit 1
          fi
          # ---- kernel name (uname -r) -- injected via LOCALVERSION env, NOT the defconfig ----
          # WHY NOT the defconfig: CONFIG_LOCALVERSION is ABSENT from this branch's common
          # gki_defconfig, and ADDING it breaks the savedefconfig check_defconfig gate (it compares
          # byte-for-byte in canonical order -- an appended line lands in the wrong spot and fails,
          # which is exactly what killed the previous run). Instead we inject the name with the
          # LOCALVERSION env var, honored by scripts/setlocalversion via
          #   res="${config_localversion}${LOCALVERSION}"  -- no source edit, no gate.
          # It is exported in the Build step and forwarded into the hermetic Bazel sandbox with
          # --action_env=LOCALVERSION.
          #
          # KILL the trailing "-android14-11-...-maybe-dirty": scripts/setlocalversion returns the
          # contents of .scmversion EARLY -- before it prints -$android_release-$kmi_generation and
          # before the git/-dirty logic -- so an EMPTY .scmversion yields an empty scm suffix and
          # uname ends exactly at ...-GAME-OVER-op. (Kleaf's DEFAULT embedded localversion MAY still
          # force -android14-11; the diagnostic step after Build prints the real release so we can
          # add --nokleaf_localversion next iteration if needed. COSMETIC -- must never fail build.)
          # CUSTOM uname (KMI-preserving): overwrite common/scripts/setlocalversion so the
          # GKI kernel (common:kernel_aarch64 -- the Image that actually boots) reports our name.
          # --nokleaf_localversion (in the Build step) makes Kleaf derive the release from this
          # script instead of its own stamp. We MUST keep the "-android14-11" KMI marker: Kleaf
          # runs a KMI/sublevel consistency check vs msm-kernel (which stays -android14-11), and a
          # release WITHOUT the marker fails the build ("KMI or sublevel mismatch" + "not a valid
          # GKI version", and it also breaks the system_dlkm image). So we emit -android14-11-<name>:
          #   uname -r = 6.1.x-android14-11-kurumi-dev-GAME-OVER-op
          # Only common is patched; msm-kernel keeps its native -android14-11-o-maybe-dirty, so both
          # carry KMI android14-11 and the check passes (the 173-vs-174 sublevel diff is tolerated,
          # exactly as in the prior booting builds). NOTE: the name is non-ASCII (Japanese) -- a
          # user-accepted risk that the erofs/image tooling could still reject it.
          : > common/.scmversion || true
          printf '#!/bin/sh\necho "%s"\n' '-android14-11-kurumi-dev-GAME-OVER-op' > common/scripts/setlocalversion
          chmod +x common/scripts/setlocalversion
          echo '--- overwrote common/scripts/setlocalversion (KMI-preserving custom release) ---'
          head -3 common/scripts/setlocalversion
          # ---- Kurumi build stamp: HARD-override identity + REAL build time ----
          # Kleaf pins KBUILD_BUILD_USER/HOST=build-user/build-host AND SOURCE_DATE_EPOCH=0
          # (=> 'Thu Jan  1 00:00:00 UTC 1970'). The kernel derives the /proc/version time from
          # SOURCE_DATE_EPOCH, not KBUILD_BUILD_TIMESTAMP, so we must override BOTH. Forcing it
          # inside mkcompile_h (runs last, in-compile) beats Kleaf; scope is this process only,
          # so other build steps' reproducibility is unaffected. Guarded + non-fatal.
          set +e
          for mch in common/scripts/mkcompile_h msm-kernel/scripts/mkcompile_h; do
            [ -f "$mch" ] || continue
            grep -q KURUMI_STAMP "$mch" && continue
            _t="$(mktemp)"
            { head -n 1 "$mch"; \
              echo '# KURUMI_STAMP: force identity + real build time (Kleaf pins user/host + SOURCE_DATE_EPOCH=0)'; \
              echo 'export KBUILD_BUILD_USER=kurumi'; \
              echo 'export KBUILD_BUILD_HOST=dev'; \
              echo '_KURUMI_EPOCH=$(date -u +%s)'; \
              echo 'export SOURCE_DATE_EPOCH=$_KURUMI_EPOCH'; \
              echo 'export KBUILD_BUILD_TIMESTAMP="$(date -u -d @$_KURUMI_EPOCH "+%a %b %e %H:%M:%S UTC %Y" 2>/dev/null || date -u "+%a %b %e %H:%M:%S UTC %Y")"'; \
              echo 'echo "kurumi mkcompile_h: SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH TS=$KBUILD_BUILD_TIMESTAMP USER=$KBUILD_BUILD_USER HOST=$KBUILD_BUILD_HOST" >&2'; \
              tail -n +2 "$mch"; } > "$_t" && cat "$_t" > "$mch"
            echo "kurumi: hard-stamped $mch"
          done
          set -e
          # ---- Kurumi build TIMESTAMP fix (init/Makefile utsversion path, Linux 6.1) ----
          # In 6.1 the /proc/version build time comes from init/Makefile (utsversion.h),
          # NOT from mkcompile_h. Kleaf runs the make action with SOURCE_DATE_EPOCH=0 and does
          # not forward our KBUILD_BUILD_TIMESTAMP into it, so $(shell LC_ALL=C date) resolves
          # via the hermetic date to 'Thu Jan  1 00:00:00 UTC 1970'. mkcompile_h only fixes
          # user@host. FIX: hardcode build-timestamp to a real literal computed here on the
          # runner, bypassing env + hermetic date entirely. Idempotent + guarded.
          set +e
          KURUMI_TS="$(date -u '+%a %b %e %H:%M:%S UTC %Y')"
          _ts_ok=0
          for mk in common/init/Makefile msm-kernel/init/Makefile; do
            [ -f "$mk" ] || continue
            grep -q 'KURUMI_TS_FIX' "$mk" && { _ts_ok=1; continue; }
            if grep -qE '^[[:space:]]*build-timestamp[[:space:]]*:?=' "$mk"; then
              sed -i -E "s|^([[:space:]]*)build-timestamp[[:space:]]*:?=.*|\1# KURUMI_TS_FIX\n\1build-timestamp = ${KURUMI_TS}|" "$mk"
              echo "kurumi: patched build-timestamp in $mk ->"; grep -nE '^[[:space:]]*build-timestamp[[:space:]]*=' "$mk"
              _ts_ok=1
            fi
          done
          [ "$_ts_ok" = 1 ] || echo 'WARN: build-timestamp not found in init/Makefile; timestamp fix NOT applied' >&2
          set -e

          # QCOM has TWO strict config gates:
          #   (1) merge_defconfig_fragments -> "Detected overridden config" if a vendor
          #       fragment DISABLES a base =y/=m symbol. So disables live in the base.
          #   (2) check_merged_defconfig (diffconfig) -> "Defconfig fragment did not apply
          #       as expected" if the resolved .config differs from the merged defconfig
          #       (anything except pure additions). So every requested symbol must STICK.
          #
          # Therefore in the base gki_defconfig:
          #   - PM_DEBUG / THERMAL_STATISTICS / THERMAL_EMULATION: flip y -> not set (they stick).
          #   - PM_ADVANCED_DEBUG: it 'depends on PM_DEBUG'. With PM_DEBUG off it becomes
          #     invisible and vanishes from .config, so we must DELETE its line entirely
          #     (an explicit '# ... is not set' would mismatch and fail gate (2)).
          #   - UBSAN: disable the top-level sanitizer symbol for daily/release builds,
          #     and DELETE its mode/suboption lines because they become hidden once the
          #     top-level sanitizer is off. Do not delete HAVE_ARCH_*/CC_HAS_* capability
          #     symbols: those are harmless capability probes, not active instrumentation.
          #   - KASAN: KEEP enabled. QCOM GKI strict KMI currently expects
          #     kasan_flag_enabled in ksymtab, so disabling KASAN breaks the build.
          #
          # NOTE: the OnePlus-base-only USB_ACM / USB_SERIAL / BT_RFCOMM disables were REMOVED.
          #   They existed solely because the OnePlus common lacked __tty_port_tty_hangup; the
          #   AOSP GKI base exports it, so those stock modules build normally and we keep full
          #   ABI/module parity with the device. Only release-safe debug/thermal/sanitizer-off
          #   tweaks stay (they touch no exported symbol / KMI). PM_ADVANCED_DEBUG and
          #   UBSAN suboptions become hidden when their parent is off, so delete their
          #   dependent lines instead of leaving explicit '# ... is not set' entries that
          #   strict merged-defconfig checks may reject. KASAN suboptions stay untouched
          #   because KASAN itself stays enabled for KMI strict mode.
          sed -i \
            -e 's/^CONFIG_PM_DEBUG=y/# CONFIG_PM_DEBUG is not set/' \
            -e '/^CONFIG_PM_ADVANCED_DEBUG=y/d' \
            -e 's/^CONFIG_THERMAL_STATISTICS=y/# CONFIG_THERMAL_STATISTICS is not set/' \
            -e 's/^CONFIG_THERMAL_EMULATION=y/# CONFIG_THERMAL_EMULATION is not set/' \
            -e 's/^CONFIG_UBSAN=y/# CONFIG_UBSAN is not set/' \
            -e '/^CONFIG_UBSAN_/d' \
            -e '/^# CONFIG_UBSAN_.* is not set$/d' \
            -e 's/^CONFIG_MODULE_SIG_PROTECT=y/# CONFIG_MODULE_SIG_PROTECT is not set/' \
            "$DEF"

          # Additive-only tweaks in the vendor fragment (enabling new symbols is allowed).
          # NOTE: BBR/TCP-default was intentionally dropped: GKI ships with
          # CONFIG_TCP_CONG_ADVANCED off, so the congestion choice is hidden and
          # TCP_CONG_BBR/DEFAULT_BBR cannot stick (gate (2) rejects them). BBR would
          # require re-opening the choice, which perturbs many symbols. Not worth it
          # for a balanced-power build; CUBIC default is fine.
          {
            echo ''
            echo '# === custom: balanced daily-use/power config (additive, verified by post-build audit) ==='
            echo 'CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y'
            # MGLRU improves page reclaim behaviour under memory pressure. It is
            # especially useful for Android daily use (many cached apps + zRAM). If
            # the symbol is already enabled in the base, this is harmless; if a future
            # tree cannot enable it, the post-build config audit will warn instead of
            # silently assuming it landed.
            echo 'CONFIG_LRU_GEN=y'
            echo 'CONFIG_LRU_GEN_ENABLED=y'
          } >> "$FRAG"
          # NOTE: the kernel NAME (uname -r) is injected via the LOCALVERSION env var in the Build
          #   step (+ empty common/.scmversion to strip the scm/KMI/-dirty suffix) -- NOT via any
          #   defconfig, to stay clear of the savedefconfig gate. Author identity also shows via
          #   KBUILD_BUILD_USER/HOST (kurumi@dev) in /proc/version.

          # ===================================================================
          # IPv6 legacy NAT (ip6tables -t nat) -- enable CONFIG_IP6_NF_NAT in the
          # COMMON GKI defconfig ($CDEF): that is the tree that builds the flashed
          # boot.img Image. (A prior attempt put this in the msm-kernel vendor
          # fragment, which does NOT feed the GKI Image, so `ip6tables -t nat` had
          # no 'nat' table on-device.) On-device /proc/config.gz confirmed every
          # dependency is already satisfied in this same common tree:
          #   NF_NAT=y, IP6_NF_IPTABLES=y (IP_NF_NAT=y -> v4 NAT already works),
          #   NF_CONNTRACK/NETFILTER_ADVANCED on, NF_TABLES off (legacy xtables).
          # No module infra on device (/lib/modules absent) -> must be builtin =y.
          # This edits a defconfig (CONFIG, not kernel source); common/ is a fresh
          # clone, so no user source tree is touched.
          #
          # IMPORTANT: do NOT try to canonicalize via a standalone `make gki_defconfig
          # savedefconfig` here. A bare make outside the Kleaf/android fragment context
          # cannot resolve ~6 symbols and silently shrinks the defconfig (observed
          # 671 -> 665). The real dist build does NOT enforce a byte-match check_defconfig
          # on common (it already ships a non-canonical gki_defconfig and builds fine),
          # so we just enable the symbol IN PLACE and let the real build's olddefconfig
          # pick it up. The post-build 'Verify' step asserts it actually landed in the
          # Image, which is the real proof.
          # ===================================================================
          if grep -q '^CONFIG_IP6_NF_NAT=y' "$CDEF"; then
            echo 'IP6_NF_NAT already enabled in common gki_defconfig'
          else
            # Insert right after the last existing CONFIG_IP6_NF_* line: if some strict
            # savedefconfig check IS enforced in the hermetic build, the symbol already
            # sits in its canonical ipv6-netfilter position; if not, position is moot.
            last_ip6=$(grep -n '^CONFIG_IP6_NF_' "$CDEF" | tail -n1 | cut -d: -f1)
            if [ -n "$last_ip6" ]; then
              sed -i "${last_ip6}a CONFIG_IP6_NF_NAT=y" "$CDEF"
            else
              echo 'CONFIG_IP6_NF_NAT=y' >> "$CDEF"
            fi
          fi
          grep -q '^CONFIG_IP6_NF_NAT=y' "$CDEF" \
            || { echo 'ERROR: failed to add CONFIG_IP6_NF_NAT to common gki_defconfig'; exit 1; }
          echo '--- common gki_defconfig IPv6 NAT context: ---'
          grep -nE 'IP6_NF_IPTABLES|IP6_NF_NAT|IP6_NF_TARGET' "$CDEF" || true

          echo '--- gki_defconfig debug/thermal lines now: ---'
          grep -nE 'PM_DEBUG|PM_ADVANCED_DEBUG|THERMAL_STATISTICS|THERMAL_EMULATION|KASAN|UBSAN|MODULE_SIG_PROTECT' "$DEF" || true
          # Hard guard: the whole boot fix depends on this flip sticking. If the base
          # gki_defconfig still has it =y, the sed missed it -> fail loudly (do NOT ship a
          # kernel that still rejects stock /system_dlkm GKI modules -> boot-anim hang).
          if grep -q '^CONFIG_MODULE_SIG_PROTECT=y' "$DEF"; then
            echo 'ERROR: MODULE_SIG_PROTECT still =y after sed flip - aborting'; exit 1
          fi
          grep -q '^# CONFIG_MODULE_SIG_PROTECT is not set' "$DEF" \
            || echo 'WARN: MODULE_SIG_PROTECT absent from base gki_defconfig; may be forced elsewhere - verify resolved .config'
          echo '--- vendor fragment tail: ---'; tail -n 8 "$FRAG"

      - name: Build kernel (standalone Kleaf/Bazel)
        working-directory: /mnt/src/kp/kernel_platform
        env:
          # Injected into the kernel release string by setlocalversion; forwarded into the Bazel
          # action sandbox by --action_env=LOCALVERSION below. Leading '-' is required.
          LOCALVERSION: "-kurumi-dev-GAME-OVER-op"
        run: |
          set -e
          # Cap concurrency + RAM budget so the peak (LTO link of vmlinux + parallel
          # module/image actions) stays within RAM+swap and does not OOM-kill the
          # runner. build_with_bazel.py forwards unknown flags verbatim to `bazel
          # build` (argparse parse_known_args), so these reach Bazel directly.
          # KBUILD_BUILD_TIMESTAMP overrides the reproducible-build epoch-0 (1970) default so the
          # real CI time lands in /proc/version. Its value has SPACES and COLONS ('Wed Jul 15
          # 16:35:20 UTC 2026'); build_with_bazel.py re-joins forwarded args into ONE shell string,
          # so passing --action_env=KBUILD_BUILD_TIMESTAMP="..." gets space-split and Bazel mistakes
          # '16:35:20' for a target (': not allowed'). FIX: export the var and use the NAME-ONLY
          # form --action_env=KBUILD_BUILD_TIMESTAMP -- Bazel then reads it from the environment and
          # the value never touches the command line. This is the same pattern that already works
          # for USER/HOST (set at job level, forwarded name-only).
          BUILD_TS="$(date -u '+%a %b %e %H:%M:%S UTC %Y')"
          export KBUILD_BUILD_TIMESTAMP="$BUILD_TS"
          echo "--- stamping build: ts='$BUILD_TS' user='${KBUILD_BUILD_USER:-}' host='${KBUILD_BUILD_HOST:-}' ---"
          ./msm-kernel/build_with_bazel.py -t pineapple gki --skip abl \
            --jobs=2 --local_ram_resources=9830 \
            --nokleaf_localversion \
            --action_env=LOCALVERSION \
            --action_env=KBUILD_BUILD_USER \
            --action_env=KBUILD_BUILD_HOST \
            --action_env=KBUILD_BUILD_TIMESTAMP

      - name: Stash stock kernel Image (variant 1 of 3)
        working-directory: /mnt/src/kp/kernel_platform
        run: |
          set -e
          DIST=out/msm-kernel-pineapple-gki/dist
          [ -d "$DIST" ] || DIST="$(dirname "$(find out -type f -name 'boot.img' -path '*dist*' 2>/dev/null | head -1)")"
          IMG=""
          for c in Image.gz Image; do [ -f "$DIST/$c" ] && { IMG="$DIST/$c"; break; }; done
          [ -n "$IMG" ] || IMG="$(find out -type f \( -name Image.gz -o -name Image \) -path '*dist*' 2>/dev/null | head -1)"
          [ -n "$IMG" ] || { echo 'ERROR: stock kernel Image not found'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/kimg"
          cp -v "$IMG" "$GITHUB_WORKSPACE/kimg/kurumi_stock"
          basename "$IMG" > "$GITHUB_WORKSPACE/kimg/imgname"
          echo "stashed stock image: $IMG (flash name $(cat "$GITHUB_WORKSPACE/kimg/imgname"))"

      - name: Print kernel release string (diagnostic, non-fatal)
        working-directory: /mnt/src/kp/kernel_platform
        run: |
          set +e
          echo '=== resolved kernel release (uname -r) as built ==='
          rel="$(find out -type f -name kernel.release 2>/dev/null | head -n1)"
          if [ -n "$rel" ]; then
            echo "KERNEL RELEASE: $(cat "$rel")"
          else
            img="$(find out -type f \( -name Image -o -name Image.gz \) 2>/dev/null | head -n1)"
            if [ -n "$img" ]; then
              case "$img" in
                *.gz) banner="$(zcat "$img" 2>/dev/null | strings -a | grep -m1 'Linux version')" ;;
                *)    banner="$(strings -a "$img" | grep -m1 'Linux version')" ;;
              esac
              echo "KERNEL BANNER: ${banner:-<not found>}"
            else
              echo 'WARN: no kernel.release or Image found to read version from'
            fi
          fi
          echo '=== expected pattern: 6.1.*-android14-11-kurumi-dev-GAME-OVER-op ==='
          echo '=== moving GKI base is OK as long as KMI marker/localversion stay correct ==='
          exit 0

      - name: Verify MODULE_SIG_PROTECT is OFF in the built kernel
        working-directory: /mnt/src/kp/kernel_platform
        run: |
          set -e
          # Extract the config baked into the produced Image and PROVE the fix
          # took effect. If the GKI build force-re-enabled MODULE_SIG_PROTECT the
          # boot.img would hang again -> FAIL here instead of shipping it. This
          # turns "flash and find out" into a CI assertion (no brick risk).
          DIST=out/msm-kernel-pineapple-gki/dist
          [ -d "$DIST" ] || DIST="$(dirname "$(find out -type f -name boot.img -path "*dist*" 2>/dev/null | head -1)")"
          IMG=""
          for c in Image Image.gz; do [ -f "$DIST/$c" ] && { IMG="$DIST/$c"; break; }; done
          [ -n "$IMG" ] || IMG="$(find out -type f \( -name Image -o -name Image.gz \) -path "*dist*" 2>/dev/null | head -1)"
          [ -n "$IMG" ] || { echo "ERROR: no kernel Image found to verify"; exit 1; }
          echo "verifying config baked into: $IMG"
          CFG="$(common/scripts/extract-ikconfig "$IMG" 2>/dev/null || true)"
          if [ -z "$CFG" ]; then echo "WARN: extract-ikconfig empty (IKCONFIG missing?) - cannot assert; continuing"; exit 0; fi
          echo "$CFG" | grep -E 'CONFIG_MODULE_SIG(_PROTECT)?=' || true
          if echo "$CFG" | grep -q '^CONFIG_MODULE_SIG_PROTECT=y'; then
            echo "ERROR: built kernel STILL has CONFIG_MODULE_SIG_PROTECT=y - GKI force-enabled it."
            echo "       Do NOT flash this boot.img; switch to flashing a matching system_dlkm."
            exit 1
          fi
          echo "OK: CONFIG_MODULE_SIG_PROTECT is disabled in the built kernel Image."
          # IPv6 legacy NAT MUST now be baked into the flashed GKI Image (enabled in the common
          # gki_defconfig). On-device /proc/config.gz proved every dependency is met, so absence
          # here means the common-defconfig edit did not reach the Image -> fail before flashing.
          echo "$CFG" | grep -E 'CONFIG_IP6_NF_NAT=' || true
          if echo "$CFG" | grep -q '^CONFIG_IP6_NF_NAT=y'; then
            echo "OK: CONFIG_IP6_NF_NAT=y is in the built kernel Image (ip6tables -t nat will work)."
          else
            echo "ERROR: CONFIG_IP6_NF_NAT missing from the built GKI Image - common gki_defconfig change did not take effect."
            exit 1
          fi

      - name: Export final kernel config audit artifacts
        working-directory: /mnt/src/kp/kernel_platform
        run: |
          set +e
          AUD="$GITHUB_WORKSPACE/kernel-audit"
          mkdir -p "$AUD"
          DIST=out/msm-kernel-pineapple-gki/dist
          [ -d "$DIST" ] || DIST="$(dirname "$(find out -type f -name boot.img -path "*dist*" 2>/dev/null | head -1)")"
          IMG=""
          for c in Image Image.gz; do [ -f "$DIST/$c" ] && { IMG="$DIST/$c"; break; }; done
          [ -n "$IMG" ] || IMG="$(find out -type f \( -name Image -o -name Image.gz \) -path "*dist*" 2>/dev/null | head -1)"
          if [ -z "$IMG" ]; then
            echo "WARN: no Image found for config audit" | tee "$AUD/kurumi-config-audit.txt"
            exit 0
          fi
          CFG="$(common/scripts/extract-ikconfig "$IMG" 2>/dev/null || true)"
          if [ -z "$CFG" ]; then
            echo "WARN: extract-ikconfig returned empty config" | tee "$AUD/kurumi-config-audit.txt"
            exit 0
          fi
          printf '%s\n' "$CFG" > "$AUD/final.config"
          rel="$(find out -type f -name kernel.release 2>/dev/null | head -1)"
          [ -n "$rel" ] && cp -v "$rel" "$AUD/kernel.release" || true
          find out -type f -name Module.symvers 2>/dev/null | head -1 | xargs -r -I{} cp -v {} "$AUD/Module.symvers"
          {
            echo '=== Kurumi final kernel config audit ==='
            echo "Image: $IMG"
            [ -f "$AUD/kernel.release" ] && echo "Release: $(cat "$AUD/kernel.release")"
            echo
            echo '--- daily-use / memory / scheduler / power ---'
            for sym in               CONFIG_LRU_GEN CONFIG_LRU_GEN_ENABLED               CONFIG_PSI CONFIG_PSI_DEFAULT_DISABLED               CONFIG_UCLAMP_TASK CONFIG_UCLAMP_TASK_GROUP               CONFIG_ENERGY_MODEL CONFIG_CPU_FREQ_GOV_SCHEDUTIL               CONFIG_CPU_IDLE CONFIG_ARM_PSCI_CPUIDLE               CONFIG_WQ_POWER_EFFICIENT_DEFAULT; do
              grep -E "^${sym}=|^# ${sym} is not set" "$AUD/final.config" || echo "$sym=<absent>"
            done
            echo
            echo '--- release/debug visibility audit (not all are bad; inspect before disabling) ---'
            for sym in               CONFIG_DEBUG_KERNEL CONFIG_DEBUG_FS CONFIG_DYNAMIC_DEBUG               CONFIG_FTRACE CONFIG_FUNCTION_TRACER CONFIG_KPROBES               CONFIG_IRQSOFF_TRACER CONFIG_SCHED_DEBUG CONFIG_LOCKDEP               CONFIG_PROVE_LOCKING CONFIG_KASAN CONFIG_KCSAN CONFIG_UBSAN               CONFIG_DEBUG_PREEMPT CONFIG_DEBUG_SPINLOCK CONFIG_DEBUG_MUTEXES               CONFIG_PM_DEBUG CONFIG_PM_ADVANCED_DEBUG               CONFIG_THERMAL_STATISTICS CONFIG_THERMAL_EMULATION; do
              grep -E "^${sym}=|^# ${sym} is not set" "$AUD/final.config" || echo "$sym=<absent>"
            done
            echo
            echo '--- recommendations ---'
            grep -q '^CONFIG_LRU_GEN=y' "$AUD/final.config" && echo 'OK: MGLRU core enabled' || echo 'WARN: CONFIG_LRU_GEN is not enabled'
            grep -q '^CONFIG_LRU_GEN_ENABLED=y' "$AUD/final.config" && echo 'OK: MGLRU enabled by default' || echo 'WARN: CONFIG_LRU_GEN_ENABLED is not enabled'
            grep -q '^CONFIG_PSI=y' "$AUD/final.config" && echo 'OK: PSI enabled' || echo 'WARN: PSI is not enabled'
            grep -q '^CONFIG_PSI_DEFAULT_DISABLED=y' "$AUD/final.config" && echo 'WARN: PSI_DEFAULT_DISABLED=y' || echo 'OK: PSI not default-disabled'
          } | tee "$AUD/kurumi-config-audit.txt"
          exit 0

      - name: Upload kernel config audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurumi-kernel-config-audit
          path: kernel-audit/*
          if-no-files-found: warn

      - name: Mark common source baseline for root variants
        working-directory: /mnt/src/kp/kernel_platform
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/kimg"
          # Snapshot the already-patched common tree after the stock build. Root variants are built
          # from this exact baseline so stock, KSU, and KSU+susfs differ only by root/susfs code.
          git -C common add -A
          git -C common commit -m "kurumi base before root variants" || true
          git -C common rev-parse HEAD > "$GITHUB_WORKSPACE/kimg/common_base_commit"
          echo "common baseline: $(cat "$GITHUB_WORKSPACE/kimg/common_base_commit")"

      - name: Integrate KernelSU-Next only (variant 2 prep, non-fatal)
        working-directory: /mnt/src/kp/kernel_platform
        run: |
          set +e
          set -x
          rm -f "$GITHUB_WORKSPACE/kimg/ksu_ok"
          BASE="$(cat "$GITHUB_WORKSPACE/kimg/common_base_commit" 2>/dev/null)"
          [ -n "$BASE" ] || { echo "WARN: common baseline missing - skipping KSU variant"; exit 0; }
          git -C common reset --hard "$BASE"
          git -C common clean -ffd

          bake_ksu_version() {
            KB="$(find . -path '*KernelSU-Next/kernel/Kbuild' 2>/dev/null | head -1)"
            KSU_TAG="$(cd common/KernelSU-Next 2>/dev/null && git describe --tags --abbrev=0 2>/dev/null || echo v1.0.0)"
            if [ -n "$KB" ] && [ "${KSU_CNT:-0}" -ge 500 ]; then
              echo "--- Kbuild version block BEFORE bake ($KB) ---"
              grep -nE 'KSU_GIT_VERSION|KSU_VERSION|KSU_GIT_TAG|30000|FALLBACK' "$KB" || true
              awk -v cnt="$KSU_CNT" -v tag="$KSU_TAG" '
                /^# Check if this is a git repository/ && !injected {
                  print "# --- Kurumi: hardcoded version for hermetic Kleaf build (no .git/network) ---"
                  print "KSU_GIT_VERSION := " cnt
                  print "KSU_GIT_TAG := " tag
                  print "KSU_GIT_VERSION_VALID := 1"
                  print ""
                  injected=1
                }
                { print }
              ' "$KB" > "$KB.ktmp" && mv "$KB.ktmp" "$KB"
              echo "--- Kbuild version block AFTER bake (KSU_GIT_VERSION=$KSU_CNT -> KSU_VERSION=$(expr 30000 + $KSU_CNT), tag=$KSU_TAG) ---"
              grep -nE 'Kurumi|KSU_GIT_VERSION|KSU_GIT_TAG|KSU_GIT_VERSION_VALID' "$KB" || true
            else
              echo "WARN: KernelSU-Next Kbuild not found or count too small (KB='$KB' KSU_CNT='$KSU_CNT') -> version NOT baked."
            fi
          }

          ( cd common && rm -rf KernelSU-Next \
              && git clone https://github.com/KernelSU-Next/KernelSU-Next.git \
              && ( cd KernelSU-Next && (git checkout "$KSU_NEXT_REF" || git checkout -b "$KSU_NEXT_REF" "origin/$KSU_NEXT_REF") ) )
          KSU_CNT="$(cd common/KernelSU-Next && git rev-list --count HEAD 2>/dev/null || echo 0)"
          echo "KernelSU-Next '$KSU_NEXT_REF' commit count (drives KSU_VERSION): $KSU_CNT"
          ( cd common && curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_NEXT_REF" )
          ksu_rc=$?
          if [ "$ksu_rc" = 0 ] && [ "${KSU_CNT:-0}" -lt 500 ]; then
            echo "WARN: KSU-Next history too shallow ($KSU_CNT) -> driver would report v0.0.1. Skipping KSU variant."
            ksu_rc=1
          fi
          if [ "$ksu_rc" = 0 ]; then
            bake_ksu_version
            echo ok > "$GITHUB_WORKSPACE/kimg/ksu_ok"
            echo "KSU-only integration OK -> building variant 2."
          else
            echo "WARN: KernelSU-Next setup failed (ksu_rc=$ksu_rc) - KSU-only variant skipped."
          fi
          set +x
          exit 0

      - name: Build kernel (KernelSU variant, non-fatal)
        working-directory: /mnt/src/kp/kernel_platform
        env:
          LOCALVERSION: "-kurumi-dev-GAME-OVER-op"
        run: |
          set +e
          [ -f "$GITHUB_WORKSPACE/kimg/ksu_ok" ] || { echo 'KSU integration skipped - not building variant 2.'; exit 0; }
          export KBUILD_BUILD_TIMESTAMP="$(date -u '+%a %b %e %H:%M:%S UTC %Y')"
          ./msm-kernel/build_with_bazel.py -t pineapple gki --skip abl \
            --jobs=2 --local_ram_resources=9830 \
            --nokleaf_localversion \
            --action_env=LOCALVERSION \
            --action_env=KBUILD_BUILD_USER \
            --action_env=KBUILD_BUILD_HOST \
            --action_env=KBUILD_BUILD_TIMESTAMP
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "WARN: KSU variant build failed (rc=$rc) - KSU-only variant skipped."
            rm -f "$GITHUB_WORKSPACE/kimg/ksu_ok"; exit 0
          fi
          DIST=out/msm-kernel-pineapple-gki/dist
          [ -d "$DIST" ] || DIST="$(dirname "$(find out -type f -name 'boot.img' -path '*dist*' 2>/dev/null | head -1)")"
          IMG=""
          for c in Image.gz Image; do [ -f "$DIST/$c" ] && { IMG="$DIST/$c"; break; }; done
          [ -n "$IMG" ] || IMG="$(find out -type f \( -name Image.gz -o -name Image \) -path '*dist*' 2>/dev/null | head -1)"
          if [ -z "$IMG" ]; then echo 'WARN: KSU Image not found post-build - KSU-only variant skipped'; rm -f "$GITHUB_WORKSPACE/kimg/ksu_ok"; exit 0; fi
          CFG="$(./common/scripts/extract-ikconfig "$IMG" 2>/dev/null || true)"
          if echo "$CFG" | grep -q '^CONFIG_KSU=y'; then
            echo 'OK: CONFIG_KSU=y baked into KSU Image'
            cp -v "$IMG" "$GITHUB_WORKSPACE/kimg/kurumi_ksu"
            echo "stashed KSU image: $IMG -> kimg/kurumi_ksu"
          else
            echo 'WARN: CONFIG_KSU=y not detected in KSU Image config - KSU-only variant skipped'
            rm -f "$GITHUB_WORKSPACE/kimg/ksu_ok"
          fi

      - name: Integrate KernelSU-Next + susfs (variant 3 prep, non-fatal)
        working-directory: /mnt/src/kp/kernel_platform
        run: |
          set +e
          set -x
          rm -f "$GITHUB_WORKSPACE/kimg/ksu_susfs_ok"
          BASE="$(cat "$GITHUB_WORKSPACE/kimg/common_base_commit" 2>/dev/null)"
          [ -n "$BASE" ] || { echo "WARN: common baseline missing - skipping KSU+susfs variant"; exit 0; }
          git -C common reset --hard "$BASE"
          git -C common clean -ffd

          bake_ksu_version() {
            KB="$(find . -path '*KernelSU-Next/kernel/Kbuild' 2>/dev/null | head -1)"
            KSU_TAG="$(cd common/KernelSU-Next 2>/dev/null && git describe --tags --abbrev=0 2>/dev/null || echo v1.0.0)"
            if [ -n "$KB" ] && [ "${KSU_CNT:-0}" -ge 500 ]; then
              awk -v cnt="$KSU_CNT" -v tag="$KSU_TAG" '
                /^# Check if this is a git repository/ && !injected {
                  print "# --- Kurumi: hardcoded version for hermetic Kleaf build (no .git/network) ---"
                  print "KSU_GIT_VERSION := " cnt
                  print "KSU_GIT_TAG := " tag
                  print "KSU_GIT_VERSION_VALID := 1"
                  print ""
                  injected=1
                }
                { print }
              ' "$KB" > "$KB.ktmp" && mv "$KB.ktmp" "$KB"
              grep -nE 'Kurumi|KSU_GIT_VERSION|KSU_GIT_TAG|KSU_GIT_VERSION_VALID' "$KB" || true
            else
              echo "WARN: KernelSU-Next Kbuild not found or count too small (KB='$KB' KSU_CNT='$KSU_CNT') -> version NOT baked."
            fi
          }

          # v6: select KernelSU-Next SuSFS first, then select a matching susfs4ksu
          # common-patch history revision by scanning the APIs referenced by supercalls.c.
          # This avoids the v5 mismatch where v3.1.0-legacy-susfs expected v2.0.0-era
          # functions but susfs4ksu gki-android14-6.1 HEAD had already moved to v2.2.0.

          cat > /tmp/kurumi_select_susfs_commit.py <<'PY_SELECT_SUS'
          from pathlib import Path
          import subprocess
          import sys

          ksu_root = Path('common/drivers/kernelsu')
          supercalls = ''
          for p in ksu_root.rglob('supercalls.c'):
              supercalls += p.read_text(errors='ignore') + '\n'
          required = []
          for name in ('susfs_set_i_state_on_external_dir', 'susfs_add_try_umount'):
              if name in supercalls:
                  required.append(name)

          print('KSU+susfs: supercalls required SuSFS APIs:', ', '.join(required) if required else '(none)')
          if not required:
              Path('/tmp/kurumi_susfs_selected_commit').write_text('HEAD')
              sys.exit(0)

          repo = Path('susfs4ksu')
          commits = subprocess.check_output(['git', '-C', str(repo), 'rev-list', '--max-count=1000', 'HEAD'], text=True).splitlines()
          for commit in commits:
              try:
                  text = subprocess.check_output([
                      'git', '-C', str(repo), 'grep', '-n', '-e', 'susfs_', commit, '--',
                      'kernel_patches/fs', 'kernel_patches/include/linux'
                  ], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              if all(name in text for name in required):
                  Path('/tmp/kurumi_susfs_selected_commit').write_text(commit)
                  print('KSU+susfs: selected compatible susfs4ksu commit:', commit)
                  sys.exit(0)

          raise SystemExit('no susfs4ksu history commit provides required APIs: ' + ', '.join(required))
          PY_SELECT_SUS

          cat > /tmp/kurumi_repair_namespace.py <<'PY_REPAIR_NS'
          from pathlib import Path
          import re

          rej = Path('common/fs/namespace.c.rej')
          if not rej.exists():
              raise SystemExit(1)
          r = rej.read_text(errors='ignore')
          if 'CL_COPY_MNT_NS' not in r or 'susfs_def.h' not in r:
              raise SystemExit(1)

          p = Path('common/fs/namespace.c')
          s = p.read_text()
          changed = False
          if '#include <linux/susfs_def.h>' not in s:
              s2, n = re.subn(
                  r'#include <linux/mnt_idmapping\.h>\s*\n',
                  '#include <linux/mnt_idmapping.h>\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n',
                  s,
                  count=1,
              )
              if n == 0:
                  s2, n = re.subn(
                      r'(#include "pnode\.h"\s*\n)',
                      '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n\\1',
                      s,
                      count=1,
                  )
              if n == 0:
                  raise SystemExit('namespace repair: no include anchor found')
              s = s2
              changed = True

          need_block = (
              '#define CL_COPY_MNT_NS' not in s or
              'extern bool susfs_is_current_ksu_domain' not in s or
              'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted' not in s
          )
          if need_block:
              block = (
                  '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                  'extern bool susfs_is_current_ksu_domain(void);\n'
                  'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n'
                  '#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n\n'
                  '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n'
              )
              lines = s.splitlines(True)
              insert_at = None
              for i, line in enumerate(lines):
                  if line.strip() == '#include "internal.h"':
                      insert_at = i + 1
                      while insert_at < len(lines) and lines[insert_at].strip() == '':
                          insert_at += 1
                      break
              if insert_at is None:
                  for i, line in enumerate(lines):
                      if line.strip().startswith('/* Maximum number of mounts'):
                          insert_at = i
                          break
              if insert_at is None:
                  for i, line in enumerate(lines):
                      if line.strip() == '#include "pnode.h"':
                          insert_at = i + 1
                          break
              if insert_at is None:
                  raise SystemExit('namespace repair: no extern block anchor found')
              lines.insert(insert_at, block)
              s = ''.join(lines)
              changed = True

          for needle in (
              '#include <linux/susfs_def.h>',
              'extern bool susfs_is_current_ksu_domain(void);',
              'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;',
              '#define CL_COPY_MNT_NS BIT(25)',
          ):
              if needle not in s:
                  raise SystemExit('namespace repair: missing after repair: ' + needle)

          if changed:
              p.write_text(s)
          print('namespace repair: applied' if changed else 'namespace repair: already present')
          PY_REPAIR_NS

          cat > /tmp/kurumi_repair_ksu_susfs.py <<'PY_REPAIR_KSU'
          from pathlib import Path
          import re

          def insert_after_internal_or_mountmax(text: str, block: str) -> tuple[str, bool]:
              if block.strip() in text:
                  return text, False
              lines = text.splitlines(True)
              insert_at = None
              for i, line in enumerate(lines):
                  if line.strip() == '#include "internal.h"':
                      insert_at = i + 1
                      while insert_at < len(lines) and lines[insert_at].strip() == '':
                          insert_at += 1
                      break
              if insert_at is None:
                  for i, line in enumerate(lines):
                      if line.strip().startswith('/* Maximum number of mounts'):
                          insert_at = i
                          break
              if insert_at is None:
                  return text, False
              lines.insert(insert_at, block)
              return ''.join(lines), True

          # Final namespace safety/compat pass. Some susfs4ksu history revisions
          # partially apply fs/namespace.c hunks but miss declarations for v2.0 symbols.
          ns = Path('common/fs/namespace.c')
          if ns.exists():
              s = ns.read_text(errors='ignore')
              changed = False
              if '#include <linux/susfs_def.h>' not in s and (
                  'susfs_is_current_ksu_domain' in s or
                  'susfs_is_sdcard_android_data_not_decrypted' in s or
                  'susfs_is_boot_completed_triggered' in s or
                  'susfs_ksu_mnt_group_ida' in s or
                  'susfs_ksu_mounts' in s
              ):
                  anchor = '#include <linux/mnt_idmapping.h>\n'
                  if anchor in s:
                      s = s.replace(anchor, anchor + '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n', 1)
                      changed = True

              need_ns = []
              if 'susfs_is_current_ksu_domain(' in s and 'extern bool susfs_is_current_ksu_domain(void);' not in s:
                  need_ns.append('extern bool susfs_is_current_ksu_domain(void);')
              if 'susfs_is_sdcard_android_data_not_decrypted' in s and 'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;' not in s:
                  need_ns.append('extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;')
              if 'susfs_is_boot_completed_triggered' in s and 'extern bool susfs_is_boot_completed_triggered;' not in s:
                  need_ns.append('extern bool susfs_is_boot_completed_triggered;')
              if 'susfs_ksu_mnt_group_ida' in s and 'extern struct ida susfs_ksu_mnt_group_ida;' not in s:
                  need_ns.append('extern struct ida susfs_ksu_mnt_group_ida;')
              if 'susfs_ksu_mounts' in s and 'extern atomic64_t susfs_ksu_mounts;' not in s:
                  need_ns.append('extern atomic64_t susfs_ksu_mounts;')
              if 'CL_COPY_MNT_NS' in s and '#define CL_COPY_MNT_NS BIT(25)' not in s:
                  need_ns.append('#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */')

              if need_ns:
                  block = '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n' + '\n'.join(need_ns) + '\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n'
                  s2, did = insert_after_internal_or_mountmax(s, block)
                  if not did:
                      raise SystemExit('KSU+susfs repair: fs/namespace.c declaration anchor not found')
                  s = s2
                  changed = True

              if changed:
                  ns.write_text(s)
                  print('KSU+susfs repair: fs/namespace.c declarations/includes fixed')

          susfs_text = ''
          for p in (Path('common/fs/susfs.c'), Path('common/include/linux/susfs.h'), Path('common/include/linux/susfs_def.h')):
              if p.exists():
                  susfs_text += p.read_text(errors='ignore') + '\n'

          # KernelSU-Next uses kprobe hook mode here. The SuSFS common patch still
          # injects legacy non-GKI hook references into input/exec/read paths:
          #   ksu_input_hook, ksu_execveat_hook, ksu_vfs_read_hook.
          # In kprobes mode those bool symbols may not be emitted by KernelSU-Next,
          # so vmlinux link fails even though the hook code is intentionally inactive.
          # Provide weak compatibility definitions; real KernelSU definitions, if present
          # in a future ref, override these weak ones. Also provide weak v2.0-era
          # SuSFS mount counters when the selected common patch references them but
          # the history revision did not define them.
          need_compat = False
          for rel in ('common/drivers/input/input.c', 'common/fs/exec.c', 'common/fs/read_write.c', 'common/fs/namespace.c'):
              pp = Path(rel)
              if pp.exists():
                  tt = pp.read_text(errors='ignore')
                  if any(x in tt for x in ('ksu_input_hook', 'ksu_execveat_hook', 'ksu_vfs_read_hook', 'susfs_ksu_mnt_group_ida', 'susfs_ksu_mounts')):
                      need_compat = True
                      break
          if need_compat:
              ksu_dir = Path('common/drivers/kernelsu')
              ksu_dir.mkdir(parents=True, exist_ok=True)
              compat = ksu_dir / 'kurumi_susfs_compat.c'
              compat.write_text(
                  '// SPDX-License-Identifier: GPL-2.0\n'
                  '/*\n'
                  ' * Kurumi compatibility glue for KernelSU-Next kprobes mode + SuSFS common patch.\n'
                  ' *\n'
                  ' * Some SuSFS common patch revisions inject legacy KernelSU non-GKI hook bools into\n'
                  ' * input/exec/read paths, while KernelSU-Next reports and builds in kprobes mode.\n'
                  ' * Weak false defaults keep those legacy paths inactive and let kprobes mode handle\n'
                  ' * root hooks. If a future KernelSU ref provides strong symbols, they override these.\n'
                  ' */\n'
                  '#include <linux/atomic.h>\n'
                  '#include <linux/cache.h>\n'
                  '#include <linux/idr.h>\n'
                  '#include <linux/types.h>\n'
                  '\n'
                  '#ifdef CONFIG_KSU\n'
                  '__attribute__((weak)) bool ksu_input_hook __read_mostly = false;\n'
                  '__attribute__((weak)) bool ksu_execveat_hook __read_mostly = false;\n'
                  '__attribute__((weak)) bool ksu_vfs_read_hook __read_mostly = false;\n'
                  '#endif\n'
                  '\n'
                  '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                  '__attribute__((weak)) struct ida susfs_ksu_mnt_group_ida = IDA_INIT(susfs_ksu_mnt_group_ida);\n'
                  '__attribute__((weak)) atomic64_t susfs_ksu_mounts = ATOMIC64_INIT(0);\n'
                  '#endif\n'
              )
              kbuilds = [ksu_dir / 'Kbuild', ksu_dir / 'Makefile']
              kbuild = next((x for x in kbuilds if x.exists()), ksu_dir / 'Kbuild')
              kb = kbuild.read_text(errors='ignore') if kbuild.exists() else ''
              if 'kurumi_susfs_compat.o' not in kb:
                  kb = kb.rstrip() + '\n\n# Kurumi: weak legacy-hook/SuSFS compatibility glue for KSU+susfs variant\nobj-$(CONFIG_KSU) += kurumi_susfs_compat.o\n'
                  kbuild.write_text(kb)
              print('KSU+susfs repair: added weak compat symbols in %s and %s' % (compat, kbuild))

          for sc in Path('common/drivers/kernelsu').rglob('supercalls.c'):
              s = sc.read_text(errors='ignore')
              if 'susfs_' not in s and 'CMD_SUSFS_' not in s:
                  continue
              changed = False

              # KernelSU-Next v3.1.0-legacy-susfs references a non_su_procs command,
              # while the matching v2.0-era susfs common tree exposes all_procs.
              if 'susfs_set_hide_sus_mnts_for_non_su_procs' in s and 'susfs_set_hide_sus_mnts_for_non_su_procs' not in susfs_text:
                  if 'susfs_set_hide_sus_mnts_for_all_procs' in susfs_text:
                      s = s.replace('susfs_set_hide_sus_mnts_for_non_su_procs', 'susfs_set_hide_sus_mnts_for_all_procs')
                      s = s.replace('CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS', 'CMD_SUSFS_HIDE_SUS_MNTS_FOR_ALL_PROCS')
                      changed = True
                      print('KSU+susfs repair: mapped hide_sus_mnts non_su API to all_procs API')

              missing_api = []
              for name in ('susfs_set_i_state_on_external_dir', 'susfs_add_try_umount', 'susfs_set_hide_sus_mnts_for_all_procs'):
                  if name in s and name not in susfs_text:
                      missing_api.append(name)
              if missing_api:
                  raise SystemExit('KSU+susfs incompatible API after history selection in %s: %s' % (sc, ', '.join(missing_api)))

              if '#include <linux/susfs.h>' not in s:
                  m = re.search(r'^(#include <linux/[^>]+>\n)+', s, flags=re.M)
                  if m:
                      s = s[:m.end()] + '#include <linux/susfs.h>\n' + s[m.end():]
                      changed = True

              # Use lambda replacements: re.sub replacement strings treat backslashes
              # specially, and v6 accidentally wrote real newlines into C strings.
              repls = [
                  (r'pr_info\("sys_reboot:\s*ppptr:\s*0x%lx\s*\\+n",\s*ppptr\);', lambda m: 'pr_info("sys_reboot: ppptr: 0x%lx \\n", (unsigned long)ppptr);'),
                  (r'pr_info\("sys_reboot:\s*u_pptr:\s*0x%lx\s*\\+n",\s*u_pptr\);', lambda m: 'pr_info("sys_reboot: u_pptr: 0x%llx \\n", (unsigned long long)u_pptr);'),
                  (r'pr_info\("sys_reboot:\s*u_ptr:\s*0x%lx\s*\\+n",\s*u_ptr\);', lambda m: 'pr_info("sys_reboot: u_ptr: 0x%llx \\n", (unsigned long long)u_ptr);'),
              ]
              for pat, fn in repls:
                  s2, n = re.subn(pat, fn, s)
                  if n:
                      s = s2
                      changed = True

              # Repair a previously broken v6-style multiline string if present.
              broken = [
                  (r'pr_info\("sys_reboot:\s*ppptr:\s*0x%lx\s*\n"\s*,\s*\(unsigned long\)ppptr\);', lambda m: 'pr_info("sys_reboot: ppptr: 0x%lx \\n", (unsigned long)ppptr);'),
                  (r'pr_info\("sys_reboot:\s*u_pptr:\s*0x%llx\s*\n"\s*,\s*\(unsigned long long\)u_pptr\);', lambda m: 'pr_info("sys_reboot: u_pptr: 0x%llx \\n", (unsigned long long)u_pptr);'),
                  (r'pr_info\("sys_reboot:\s*u_ptr:\s*0x%llx\s*\n"\s*,\s*\(unsigned long long\)u_ptr\);', lambda m: 'pr_info("sys_reboot: u_ptr: 0x%llx \\n", (unsigned long long)u_ptr);'),
              ]
              for pat, fn in broken:
                  s2, n = re.subn(pat, fn, s, flags=re.S)
                  if n:
                      s = s2
                      changed = True

              if changed:
                  sc.write_text(s)
                  print('KSU+susfs repair: %s compatibility/includes/format fixed' % sc)
          PY_REPAIR_KSU

          # 1) Add KernelSU-Next with pre-integrated SuSFS glue.
          # v9: auto-select the newest compatible KernelSU-Next ref instead of
          # stopping at an old v3.1.x tag. The Manager app follows upstream
          # releases; the kernel driver version is derived from git commit count
          # (KSU_VERSION = 30000 + rev-list --count HEAD). Keep KSU+SuSFS at or
          # above the current manager minimum whenever upstream provides a fresh
          # legacy-susfs ref.
          (
            cd common && rm -rf KernelSU-Next \
            && git clone https://github.com/KernelSU-Next/KernelSU-Next.git \
            && (
              cd KernelSU-Next \
              && git fetch --all --tags --force \
              && MIN_VER="${KSU_SUSFS_MIN_VERSION:-33188}" \
              && ALLOW_OLD="${KSU_SUSFS_ALLOW_OLD:-false}" \
              && REQ_REF="${KSU_SUSFS_REF:-auto}" \
              && : > /tmp/kurumi_ksu_susfs_candidates \
              && if [ -n "$REQ_REF" ] && [ "$REQ_REF" != auto ]; then echo "$REQ_REF" >> /tmp/kurumi_ksu_susfs_candidates; fi \
              && git for-each-ref --format='%(refname:short)' refs/heads refs/remotes/origin refs/tags \
                   | sed 's#^origin/##' \
                   | grep -Ei '(^|[-_/])legacy[-_]?susfs($|[-_])|susfs.*legacy|legacy.*susfs' \
                   >> /tmp/kurumi_ksu_susfs_candidates || true \
              && printf '%s\n' legacy-susfs-v2 legacy-susfs v3.2.0-legacy-susfs-v2 v3.1.0-legacy-susfs >> /tmp/kurumi_ksu_susfs_candidates \
              && awk 'NF && !seen[$0]++' /tmp/kurumi_ksu_susfs_candidates > /tmp/kurumi_ksu_susfs_candidates.uniq \
              && echo 'KSU+susfs: candidate KernelSU-Next refs:' \
              && sed 's/^/  - /' /tmp/kurumi_ksu_susfs_candidates.uniq \
              && BEST_REF="" BEST_VER=0 BEST_CNT=0 BEST_HAS_MIN="" \
              && while IFS= read -r ref; do \
                   [ -n "$ref" ] || continue; \
                   git reset --hard -q HEAD >/dev/null 2>&1 || true; \
                   git clean -ffd -q >/dev/null 2>&1 || true; \
                   if git rev-parse --verify --quiet "$ref^{commit}" >/dev/null; then \
                     git checkout -q "$ref" || continue; \
                   elif git rev-parse --verify --quiet "tags/$ref^{commit}" >/dev/null; then \
                     git checkout -q "tags/$ref" || continue; \
                   elif git rev-parse --verify --quiet "origin/$ref^{commit}" >/dev/null; then \
                     git checkout -q -B "$ref" "origin/$ref" || continue; \
                   else \
                     echo "KSU+susfs: candidate ref not found: $ref"; continue; \
                   fi; \
                   if ! grep -Rqs 'config[[:space:]]\+KSU_SUSFS' kernel common drivers 2>/dev/null; then \
                     echo "KSU+susfs: skip '$ref' -> no CONFIG_KSU_SUSFS"; continue; \
                   fi; \
                   cnt="$(git rev-list --count HEAD 2>/dev/null || echo 0)"; \
                   ver="$((30000 + cnt))"; \
                   echo "KSU+susfs: candidate '$ref' -> KSU_VERSION=$ver (commit_count=$cnt)"; \
                   if [ "$ver" -ge "$MIN_VER" ]; then \
                     if [ -z "$BEST_HAS_MIN" ] || [ "$ver" -gt "$BEST_VER" ]; then \
                       BEST_REF="$ref"; BEST_VER="$ver"; BEST_CNT="$cnt"; BEST_HAS_MIN=1; \
                     fi; \
                   elif [ -z "$BEST_HAS_MIN" ] && [ "$ver" -gt "$BEST_VER" ]; then \
                     BEST_REF="$ref"; BEST_VER="$ver"; BEST_CNT="$cnt"; \
                   fi; \
                 done < /tmp/kurumi_ksu_susfs_candidates.uniq \
              && [ -n "$BEST_REF" ] \
              && if [ -z "$BEST_HAS_MIN" ] && [ "$ALLOW_OLD" != true ]; then \
                   echo "WARN: newest KSU+susfs ref '$BEST_REF' reports KSU_VERSION=$BEST_VER, below manager minimum $MIN_VER; set KSU_SUSFS_ALLOW_OLD=true to build it anyway."; \
                   exit 25; \
                 fi \
              && (git checkout -q "$BEST_REF" || git checkout -q "tags/$BEST_REF" || git checkout -q -B "$BEST_REF" "origin/$BEST_REF") \
              && echo "$BEST_REF" > "$GITHUB_WORKSPACE/kimg/ksu_susfs_ref" \
              && echo "$BEST_VER" > "$GITHUB_WORKSPACE/kimg/ksu_susfs_version" \
              && echo "$BEST_CNT" > "$GITHUB_WORKSPACE/kimg/ksu_susfs_commit_count" \
              && echo "KSU+susfs: selected KernelSU-Next ref '$BEST_REF' -> KSU_VERSION=$BEST_VER"
            )
          )
          ksu_pre_rc=$?
          if [ "$ksu_pre_rc" != 0 ]; then
            if [ "$ksu_pre_rc" = 25 ]; then
              echo "WARN: no up-to-date KernelSU-Next SuSFS ref meets KSU_SUSFS_MIN_VERSION=${KSU_SUSFS_MIN_VERSION:-33188}; KSU+susfs variant skipped to avoid Manager/UAPI mismatch."
            else
              echo "WARN: no usable pre-integrated KernelSU-Next SuSFS ref found (requested '$KSU_SUSFS_REF') - KSU+susfs variant skipped."
            fi
            exit 0
          fi
          KSU_SUSFS_SELECTED_REF="$(cat "$GITHUB_WORKSPACE/kimg/ksu_susfs_ref" 2>/dev/null)"
          KSU_CNT="$(cd common/KernelSU-Next && git rev-list --count HEAD 2>/dev/null || echo 0)"
          echo "KernelSU-Next SuSFS ref '$KSU_SUSFS_SELECTED_REF' commit count (drives KSU_VERSION): $KSU_CNT"
          (
            cd common && curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_SUSFS_SELECTED_REF"
          )
          ksu_rc=$?
          if [ "$ksu_rc" = 0 ] && [ "${KSU_CNT:-0}" -lt 500 ]; then
            echo "WARN: KSU-Next susfs history too shallow ($KSU_CNT) -> driver would report v0.0.1. Skipping KSU+susfs variant."
            ksu_rc=1
          fi
          if [ "$ksu_rc" != 0 ]; then
            echo "WARN: KSU-Next susfs setup failed (ksu_rc=$ksu_rc) - KSU+susfs variant skipped."
            exit 0
          fi
          KSU_DIR="$(find common -maxdepth 2 -type d \( -name 'KernelSU-Next' -o -name 'KernelSU' \) 2>/dev/null | head -1)"
          [ -d "$KSU_DIR" ] || { echo "WARN: KernelSU directory not found after setup - KSU+susfs variant skipped."; exit 0; }
          grep -Rqs 'config[[:space:]]\+KSU_SUSFS' "$KSU_DIR" common 2>/dev/null || {
            echo "WARN: selected KernelSU-Next ref '$KSU_SUSFS_SELECTED_REF' has no CONFIG_KSU_SUSFS - KSU+susfs variant skipped."
            exit 0
          }
          echo "KSU+susfs: selected KernelSU-Next ref exposes CONFIG_KSU_SUSFS."

          # 2) Add a matching SuSFS common patch revision.
          rm -rf susfs4ksu
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          python3 /tmp/kurumi_select_susfs_commit.py
          sus_select_rc=$?
          if [ "$sus_select_rc" != 0 ]; then
            echo "WARN: no compatible susfs4ksu common revision found for '$KSU_SUSFS_SELECTED_REF' - KSU+susfs variant skipped."
            exit 0
          fi
          SUS_COMMIT="$(cat /tmp/kurumi_susfs_selected_commit 2>/dev/null || echo HEAD)"
          [ "$SUS_COMMIT" = HEAD ] || git -C susfs4ksu checkout "$SUS_COMMIT"
          echo "KSU+susfs: using susfs4ksu common revision: $(git -C susfs4ksu rev-parse --short HEAD)"
          SUS="$PWD/susfs4ksu/kernel_patches"
          SUS_PATCH="$SUS/50_add_susfs_in_gki-android14-6.1.patch"
          [ -f "$SUS_PATCH" ] || { echo "WARN: susfs common patch missing: $SUS_PATCH"; exit 0; }
          cp -v "$SUS"/fs/* common/fs/ 2>/dev/null
          cp -v "$SUS"/include/linux/* common/include/linux/ 2>/dev/null
          (
            cd common && patch -p1 --fuzz=3 --no-backup-if-mismatch < "$SUS_PATCH"
          )
          sus_rc=$?
          REJ="$(cd common && find . -name '*.rej' 2>/dev/null | sort)"
          if [ "$sus_rc" != 0 ] || [ -n "$REJ" ]; then
            echo '=================== susfs .rej DUMP (send this to fix susfs next run) ==================='
            for r in $REJ; do echo "----- common/$r -----"; sed -n '1,160p' "common/$r"; done
            echo '========================================================================================'
            if [ "$REJ" = "./fs/namespace.c.rej" ] && python3 /tmp/kurumi_repair_namespace.py; then
              rm -f common/fs/namespace.c.rej
              REJ="$(cd common && find . -name '*.rej' 2>/dev/null | sort)"
              if [ -z "$REJ" ]; then
                echo "KSU+susfs: repaired known fs/namespace.c include hunk reject; continuing."
                sus_rc=0
              fi
            fi
            if [ "$sus_rc" != 0 ] || [ -n "$REJ" ]; then
              echo "WARN: susfs kernel patch did NOT apply cleanly -> KSU+susfs variant skipped."
              ( cd common && find . -name '*.rej' -delete; find . -name '*.orig' -delete ) 2>/dev/null
              exit 0
            fi
          fi

          if ! python3 /tmp/kurumi_repair_ksu_susfs.py; then
            echo "WARN: KSU+susfs source compatibility repair failed -> KSU+susfs variant skipped."
            exit 0
          fi

          grep -Rqs 'config[[:space:]]\+KSU_SUSFS' "$KSU_DIR" common 2>/dev/null || {
            echo "WARN: KSU_SUSFS Kconfig symbol not found after KSU-side integration - KSU+susfs variant skipped."
            exit 0
          }
          bake_ksu_version

          for kc in $(grep -rlE 'config[[:space:]]+KSU_SUSFS' "$KSU_DIR" common 2>/dev/null | sort -u); do
            echo "susfs: flipping defaults to y in $kc"
            awk '
              /^[[:space:]]*config[[:space:]]+KSU_SUSFS/ {blk=1}
              /^[[:space:]]*config[[:space:]]/ && $0 !~ /^[[:space:]]*config[[:space:]]+KSU_SUSFS/ {blk=0}
              { if (blk && $0 ~ /^[[:space:]]*default[[:space:]]+n[[:space:]]*$/) sub(/default[[:space:]]+n/,"default y"); print }
            ' "$kc" > "$kc.ktmp" && mv "$kc.ktmp" "$kc"
          done

          echo ok > "$GITHUB_WORKSPACE/kimg/ksu_susfs_ok"
          echo "KSU+susfs integration OK -> building variant 3."
          set +x
          exit 0

      - name: Build kernel (KernelSU + susfs variant, non-fatal)
        working-directory: /mnt/src/kp/kernel_platform
        env:
          LOCALVERSION: "-kurumi-dev-GAME-OVER-op"
        run: |
          set +e
          [ -f "$GITHUB_WORKSPACE/kimg/ksu_susfs_ok" ] || { echo 'KSU+susfs integration skipped - not building variant 3.'; exit 0; }
          export KBUILD_BUILD_TIMESTAMP="$(date -u '+%a %b %e %H:%M:%S UTC %Y')"
          ./msm-kernel/build_with_bazel.py -t pineapple gki --skip abl \
            --jobs=2 --local_ram_resources=9830 \
            --nokleaf_localversion \
            --action_env=LOCALVERSION \
            --action_env=KBUILD_BUILD_USER \
            --action_env=KBUILD_BUILD_HOST \
            --action_env=KBUILD_BUILD_TIMESTAMP
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "WARN: KSU+susfs variant build failed (rc=$rc) - variant skipped."
            rm -f "$GITHUB_WORKSPACE/kimg/ksu_susfs_ok"; exit 0
          fi
          DIST=out/msm-kernel-pineapple-gki/dist
          [ -d "$DIST" ] || DIST="$(dirname "$(find out -type f -name 'boot.img' -path '*dist*' 2>/dev/null | head -1)")"
          IMG=""
          for c in Image.gz Image; do [ -f "$DIST/$c" ] && { IMG="$DIST/$c"; break; }; done
          [ -n "$IMG" ] || IMG="$(find out -type f \( -name Image.gz -o -name Image \) -path '*dist*' 2>/dev/null | head -1)"
          if [ -z "$IMG" ]; then echo 'WARN: KSU+susfs Image not found post-build - variant skipped'; rm -f "$GITHUB_WORKSPACE/kimg/ksu_susfs_ok"; exit 0; fi
          CFG="$(./common/scripts/extract-ikconfig "$IMG" 2>/dev/null || true)"
          echo "$CFG" | grep -E '^CONFIG_KSU=y|^CONFIG_KSU_SUSFS=y' || true
          if echo "$CFG" | grep -q '^CONFIG_KSU=y' && echo "$CFG" | grep -q '^CONFIG_KSU_SUSFS=y'; then
            echo 'OK: CONFIG_KSU=y and CONFIG_KSU_SUSFS=y baked into KSU+susfs Image'
            cp -v "$IMG" "$GITHUB_WORKSPACE/kimg/kurumi_ksu_susfs"
            echo "stashed KSU+susfs image: $IMG -> kimg/kurumi_ksu_susfs"
          else
            echo 'WARN: CONFIG_KSU_SUSFS=y not detected in Image config - KSU+susfs variant skipped'
            rm -f "$GITHUB_WORKSPACE/kimg/ksu_susfs_ok"
          fi

      - name: Package Kurumi flashable zip (kernel only)
        working-directory: /mnt/src/kp/kernel_platform
        run: |
          set -e
          # TEST FIRST WITH RAM-BOOT: `fastboot boot boot.img` (from out-artifacts) loads the
          # kernel into RAM WITHOUT writing any partition -- a bad kernel is undone by a simple
          # reboot (hold Power ~10s), so it CANNOT brick /data. Only after the kernel is confirmed
          # stable in RAM should you consider the Kurumi zip below (permanent). The zip replaces
          # ONLY the kernel inside the device's own boot image, preserving the original ramdisk;
          # vbmeta is NOT touched or signed (patch_vbmeta_flag=0).
          AK="$GITHUB_WORKSPACE/anykernel"
          KIMG="$GITHUB_WORKSPACE/kimg"
          [ -f "$KIMG/kurumi_stock" ] || { echo 'ERROR: stashed stock kernel image missing; cannot build zip'; exit 1; }
          IMGNAME="$(cat "$KIMG/imgname" 2>/dev/null || echo Image.gz)"
          echo "stock image: $KIMG/kurumi_stock (flash name: $IMGNAME)"
          [ -f "$AK/anykernel.sh" ] || { echo 'ERROR: anykernel/ framework missing from repo'; exit 1; }
          # All three profile binaries must have been produced by the Rust step above.
          for p in eco balance full; do
            KB="$AK/files/kurumi_bin/kurumi_$p"
            [ -f "$KB" ] || { echo "ERROR: profile binary kurumi_$p missing (Rust build step did not run?)"; exit 1; }
            file "$KB" | grep -q 'ELF' || { echo "ERROR: kurumi_$p is not an ELF binary"; exit 1; }
          done
          # interactive-installer assets must be shipped too
          [ -f "$AK/tools/keycheck" ]       || { echo 'ERROR: tools/keycheck missing'; exit 1; }
          [ -f "$AK/tools/kurumi_menu.sh" ] || { echo 'ERROR: tools/kurumi_menu.sh missing'; exit 1; }
          [ -f "$AK/files/dtb/kurumi_gpu.dtb" ] || { echo 'ERROR: files/dtb/kurumi_gpu.dtb (custom GPU table) missing'; exit 1; }
          [ -f "$AK/files/dtb/stock_gpu.dtb" ] || { echo 'ERROR: files/dtb/stock_gpu.dtb (stock GPU dtb for revert) missing'; exit 1; }
          # Drop the freshly built kernels in, replacing any stale images.
          # Ship variants under names AnyKernel will NOT auto-detect; the flash-time menu copies
          # the chosen one to $home/$IMGNAME before split_boot/flash_boot. Never ship a bare
          # Image/Image.gz here or AnyKernel would auto-flash it and bypass the choice.
          mkdir -p "$AK/files/image"
          rm -f "$AK"/Image "$AK"/Image.gz "$AK"/Image-dtb "$AK"/Image.gz-dtb \
            "$AK"/files/image/kurumi_stock "$AK"/files/image/kurumi_ksu "$AK"/files/image/kurumi_ksu_susfs
          cp -v "$KIMG/kurumi_stock" "$AK/files/image/kurumi_stock"
          printf '%s\n' "$IMGNAME" > "$AK/files/image/kurumi_imgname"
          _variants="stock"
          if [ -f "$KIMG/ksu_ok" ] && [ -f "$KIMG/kurumi_ksu" ]; then
            cp -v "$KIMG/kurumi_ksu" "$AK/files/image/kurumi_ksu"
            _variants="$_variants + KSU"
          fi
          if [ -f "$KIMG/ksu_susfs_ok" ] && [ -f "$KIMG/kurumi_ksu_susfs" ]; then
            cp -v "$KIMG/kurumi_ksu_susfs" "$AK/files/image/kurumi_ksu_susfs"
            _variants="$_variants + KSU+susfs"
          fi
          echo "packaging variants: $_variants"
          # make sure the flasher binaries stay executable inside the zip
          chmod 0755 "$AK"/tools/* "$AK"/META-INF/com/google/android/update-binary || true
          mkdir -p "$GITHUB_WORKSPACE/out-artifacts"
          ZIP="$GITHUB_WORKSPACE/out-artifacts/Kurumi_kernel_build${GITHUB_RUN_NUMBER}.zip"
          ( cd "$AK" && zip -r9 "$ZIP" . -x '.git*' )
          echo 'Kurumi zip contents:'; unzip -l "$ZIP"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiro-kernel
          path: out-artifacts/**
          if-no-files-found: warn
          retention-days: 14
